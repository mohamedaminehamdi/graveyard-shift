[project]
name = "graveyard-shift"
version = "0.1.0"
description = "Ghost agents that work your night shift: mail, files, calendar and code, on local Gemma 4, while you sleep."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.0",
    "tabpfn>=9.2.0,<9.3",
    "temporalio>=1.18",
    "pyobjc-framework-EventKit>=11; sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: needs model weights or a local Ollama"]

[project.scripts]
graveyard-shift = "graveyard_shift.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graveyard_shift"]
exclude = ["graveyard_shift/web/post"]
